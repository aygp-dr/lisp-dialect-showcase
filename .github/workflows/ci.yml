name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: clojure (bb check)
    runs-on: ubuntu-latest
    # The Clojure project root is the repo root: src/clojure is regenerated by
    # `make tangle`, and `make clean` deletes every file under src/.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: clj-${{ runner.os }}-
      - run: bb check
